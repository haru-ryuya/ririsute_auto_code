name: Weekend Present

on:
  schedule:
    # 毎週金曜日 22:00 JST
    - cron: "0 13 * * 5"

  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest

    env:
      USER_ID: ${{ secrets.USER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bundle install
        run: |
          bundle install

      - name: Install Playwright Chromium
        run: |
          npx playwright install chromium

      - name: Run bot
        run: |
          ruby main.rb
